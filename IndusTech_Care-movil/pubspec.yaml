name: industech_mobile
description: IndusTech Care - Sistema de Gestión de Mantenimiento Industrial
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "./assets/icon/logo.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "./assets/icon/logo.png"

flutter:
  uses-material-design: true